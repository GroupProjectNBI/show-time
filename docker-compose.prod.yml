services:
  cinema-app:
    # Matchar din Docker Hub-push från GitHub Action
    image: ${DOCKER_USERNAME}/cinema-app:latest
    container_name: cinema_main
    restart: unless-stopped

    environment:
      - PORT=${PORT}
      - FRONTEND_PATH=${FRONTEND_PATH}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_CREATE_TABLES=${DB_CREATE_TABLES}
      - DB_SEED_DATA=${DB_SEED_DATA}
      - DEBUG_ON=${DEBUG_ON}
      - SESSION_LIFETIME=${SESSION_LIFETIME}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      # LÄGG TILL DENNA om din C#-kod kräver CONNECTION_STRING:
      - CONNECTION_STRING=Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Uid=${DB_USER};Pwd=${DB_PASS};

    labels:
      - "traefik.enable=true"
      # 1. Ändrad regel för att lyssna på /showtime
      - "traefik.http.routers.cinema.rule=Host(`jarllindquist.com`) && PathPrefix(`/showtime`)"
      - "traefik.http.routers.cinema.entrypoints=websecure"
      - "traefik.http.routers.cinema.tls.certresolver=myresolver"

      # 2. Middleware: Klipp bort /showtime innan anropet når din C#-kod
      - "traefik.http.middlewares.showtime-strip.stripprefix.prefixes=/showtime"
      - "traefik.http.routers.cinema.middlewares=showtime-strip"

      # 3. Porten inuti containern
      - "traefik.http.services.cinema.loadbalancer.server.port=${PORT}"
      - "traefik.http.routers.cinema.priority=1" # Högre prioritet så den inte krockar med root-domänen

    networks:
      - traefik-net # <-- Rättat stavfel här!

networks:
  traefik-net:
    external: true # <--- Berätta för Docker att nätverket redan finns
