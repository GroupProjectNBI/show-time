services:
  cinema-app:
    # Matchar din Docker Hub-push från GitHub Action
    image: ${DOCKER_USERNAME}/cinema-app:latest
    container_name: cinema_main
    restart: unless-stopped

    environment:
      - PORT=${PORT}
      - FRONTEND_PATH=${FRONTEND_PATH}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_CREATE_TABLES=${DB_CREATE_TABLES}
      - DB_SEED_DATA=${DB_SEED_DATA}
      - DEBUG_ON=${DEBUG_ON}
      - SESSION_LIFETIME=${SESSION_LIFETIME}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - CONNECTION_STRING=Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Uid=${DB_USER};Pwd=${DB_PASS};

      # --- DESSA 5 RADER LADES TILL ---
      - aiAccessToken=${aiAccessToken}
      - smtpServer=${smtpServer}
      - smtpPort=${smtpPort}
      - emailUsername=${emailUsername}
      - emailPassword=${emailPassword}

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cinema.rule=Host(`showtime.jarllindquist.com`)"
      - "traefik.http.routers.cinema.entrypoints=websecure"
      - "traefik.http.routers.cinema.tls.certresolver=myresolver"

      # 3. Porten inuti containern
      - "traefik.http.services.cinema.loadbalancer.server.port=${PORT}"
      - "traefik.http.routers.cinema.priority=100"

      # --- 🛡️ 1. Rate Limiting (Stoppar spam och överbelastning) ---
      - "traefik.http.middlewares.cinema-limit.ratelimit.average=100"
      - "traefik.http.middlewares.cinema-limit.ratelimit.burst=50"

      # --- 🛡️ 2. Security Headers (Skyddar besökarnas webbläsare) ---
      - "traefik.http.middlewares.cinema-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.cinema-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.cinema-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.cinema-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.cinema-headers.headers.frameDeny=true"

      # --- 🔗 3. Aktivera skydden på routern ---
      - "traefik.http.routers.cinema.middlewares=cinema-limit,cinema-headers"

    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
